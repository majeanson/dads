# Test-only config for @cloudflare/vitest-pool-workers.
# Same as wrangler.toml minus [assets] (dist/ may not exist in CI and is
# irrelevant to worker tests) and minus the custom domain route.
name = "dads"
main = "src/worker/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [{ name = "ROOM", class_name = "RoomDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# miniflare fakes this database locally; the id is a placeholder, never a real
# Cloudflare resource. Schema is applied per-run by test/apply-migrations.ts.
[[d1_databases]]
binding = "DB"
database_name = "dads"
database_id = "dads-test"
migrations_dir = "migrations"

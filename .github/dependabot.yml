version: 2
updates:
  # Monthly, grouped, so it is one PR to read rather than twenty. CI runs on
  # each; a major that a plugin's peer range does not allow yet will fail
  # there (vitest 5, TypeScript 7 at the time of writing) and waits.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

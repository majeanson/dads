# Weekly dependency nudge (DevHub kit/: edit there, sync from the Kit tab).
# Minor + patch bumps are grouped into one PR a week; majors come one at a time.
# At most 5 open at once. CI is the gate: a red Dependabot PR is not merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Toronto
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - dependencies

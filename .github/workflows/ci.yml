name: CI

on:
  push:
  pull_request:

# Static checks, unit tests and the build. Everything here runs without a
# browser, without wrangler dev and without a single credential, so it stays
# cheap enough to run on every push.
#
# The browser suite lives in e2e.yml, which this workflow triggers on main.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # The palette in both themes, and the two explicit theme blocks against
      # the two they are copied from.
      - run: npm run audit:contrast
      # In workerd, against the real migrations: a migration that does not
      # apply fails the suite.
      - run: npm test
      - run: npm run build

  # Every green push to main goes live (decided 2026-09-11; until then deploys
  # were by hand on purpose). The order is the one the hand-run always had:
  # migrations first, then the Worker, so code never meets a schema it has not
  # seen. The unit suite above has already applied every migration to a fresh
  # D1, which is the "is it safe" check a person used to do by reading it.
  #
  # Not waiting on the browser suite: e2e.yml takes minutes and runs on this
  # same commit as soon as this workflow succeeds. The trade is that a
  # regression only a browser catches can ship for as long as it takes to
  # notice the red run — for five friends, a trade worth making.
  #
  # DEPLOY_ENABLED is a repository variable, so the job can be switched off
  # without editing this file. CLOUDFLARE_API_TOKEN (Workers Scripts, D1 and
  # Workers R2 edit) and CLOUDFLARE_ACCOUNT_ID are repository secrets.
  deploy:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      # Two pushes in quick succession deploy in order, never on top of each
      # other; the later one wins, which is the one that should.
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate:remote
      # Tee'd for the workers.dev address: the custom domain's bot protection
      # answers a runner's plain fetch with 403, and that host is the same
      # Worker with nothing in front of it.
      - run: |
          set -o pipefail
          npm run deploy 2>&1 | tee deploy.log
          echo "WORKERS_DEV_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_ENV"
      # A deploy that returned 0 is not a deploy that landed. The live door
      # must name the bundle this build produced — the same check the app
      # itself runs on every return to the foreground. The custom domain is
      # asked first; when it refuses the runner, workers.dev is the same
      # answer from the same Worker.
      - name: Prove the live site serves this build
        run: |
          set -euo pipefail
          want=$(grep -oE '/assets/index-[^"]+\.js' dist/index.html | head -1)
          echo "built  $want"
          for i in 1 2 3 4 5 6; do
            for host in https://dads.marcportal.com "${WORKERS_DEV_URL:-https://dads.marc-jeanson.workers.dev}"; do
              got=$(curl -sS -H 'Cache-Control: no-cache' "$host/" | grep -oE '/assets/index-[^"]+\.js' | head -1 || true)
              echo "live   $host  ${got:-<nothing>}"
              if [ "$got" = "$want" ]; then exit 0; fi
            done
            sleep 10
          done
          echo "the live site never served this build" >&2
          exit 1

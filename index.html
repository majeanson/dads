<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the page owns the whole screen on a notched
         phone; tokens.css pays that back with safe-area padding, which is what
         keeps the Send button off the home indicator. -->
    <!-- interactive-widget=resizes-content: on Android the keyboard shrinks
         the page rather than covering it, so the composer stays above the
         keys. iOS ignores it; useVisualViewport does the same job there. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The real palette, not an approximation of it: these are --bg from
         tokens.css, light and dark. -->
    <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)" />
    <!-- A private room on a public domain. Nothing to index. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- What a chat app unfurls when the address is pasted. An invite link
         (/i/<token>) gets its own, with the room's name, from the Worker. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="dads" />
    <meta property="og:title" content="dads" />
    <meta
      property="og:description"
      content="A room for a few dads: somewhere to talk, and a table to sit at."
    />
    <meta property="og:image" content="https://dads.marcportal.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The one face, on the critical path because it sets the door's wordmark
         and the room's own name. crossorigin even same-origin: a font is
         always fetched in CORS mode, and without it the preload is wasted and
         the file is downloaded twice. -->
    <link
      rel="preload"
      href="/fonts/bricolage-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="dads" />

    <title>dads</title>
    <script>
      // Before the first paint, not after React mounts: a dad who asked for
      // dark should never get a white flash on his way into the room, and the
      // language belongs on <html> for anything reading the page aloud.
      try {
        var theme = localStorage.getItem('dads.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          // The phone's own chrome follows the choice too, or a dad who asked
          // for dark still gets a white bar above the room.
          var bar = document.querySelector('meta[name="theme-color"]:not([media])');
          if (!bar) {
            bar = document.createElement('meta');
            bar.setAttribute('name', 'theme-color');
            document.head.appendChild(bar);
          }
          bar.setAttribute('content', theme === 'dark' ? '#121314' : '#fcfcfb');
        }
        var lang = localStorage.getItem('dads.lang');
        if (lang === 'en' || lang === 'fr') document.documentElement.lang = lang;
      } catch (e) {
        // Storage refused. The phone's own setting still applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
